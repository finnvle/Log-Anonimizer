name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # the newest patch, as the release builds use
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - name: examples still restore exactly
        if: runner.os != 'Windows'
        run: |
          ./examples/regenerate.sh
          git diff --exit-code -- examples/sample.anon.log examples/sample.restored.log examples/show.txt
