# Pushing a tag vX.Y.Z builds the binaries and creates a DRAFT release with
# them. Nothing is published until someone reviews the draft and publishes it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the newest 1.26 patch, not the minimum in go.mod: patches carry
      # security fixes (crypto, net) that end up in the binaries
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go version
      - name: tag matches the version in the code
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/app/app.go)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Version is $v"; exit 1; }
      - run: go test ./...
      - run: ./scripts/build.sh
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" dist/log_anonimizer_${v}_* dist/SHA256SUMS \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
